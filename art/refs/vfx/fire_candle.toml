[moment]
gather = "S3 2.2 s and 7.9 s: before the stream, a huge four-point star flare (long thin spikes, one pair horizontal, one pair diagonal, a white-hot centre with a thin gold ring) fills the frame: the flare is the gather and the hit flash together, with small orange sparks streaking away from it. S1 17.2 s (a loop's gather): a glowing red wick dot then a small flame at the wick."
hit = "S3 3.15 s: a cone of fire, narrow at the weapon and widening toward the camera, white-yellow in the middle shading to orange then red at the rim, with black-brown rock chunks and a darker brown cloud under it; the cone is the biggest, brightest thing. S1 is a loop, so it has no hit; the nearest is the puff at 13.4 s that lays the flame flat."
body = "S1 steady (0.5-12 s): a single tall teardrop twice as tall as wide, cream-white inside with a yellow-orange rim and a faint blue base at the wick, a soft halo round it, the wick tip glowing red; it never holds one shape: it leans, shrinks to a short round bulb (7.3 s), stretches (9.0 s), bends (10.7 s, 12.4 s). The wax top is lit warm in a gradient. S2: dozens of long tapered tongues side by side, each pale-yellow in the core and orange at the edge, with black gaps between, all leaning the same way and slightly blurred; the depth comes from overlapping. S3 0.3 s and 11.7 s: a ribbon of flame lying along the floor made of layered hard-edged tongues, red-orange with a yellow heart and flecks of ember; 3.15 s, 8.85-9.8 s, 13.6 s: the fire cone."
breakup = "S1 blow-out: 13.4 s the flame laid flat sideways; 13.78 s torn, a thin dark tail behind it; 14.16 s it snaps upright fat and round (a balloon one and a half times wider); 14.54 s it stretches long, twice its old height, bent over; 14.92 s only a small white sliver and a faint blue wisp. The flame goes in about 1.5 s (45 frames) and the last part (14.5 to 14.9 s) is a stretch then a vanish, not a fade. S3 10.75 s: the cone thins and slants into a long narrow stream and its brown debris cloud drops away."
residue = "S1 14.9-17.2 s (2.3 s, about 70 frames): the only thing left is a tiny red-orange glowing dot at the wick tip with faint blue and orange wisps beside it (no visible smoke); at 17.2 s a small orange-edged flame re-grows from that dot, at 17.58 s it is laid flat, and the full flame is back by about 21 s. S3 11.7 s: the ribbon of flame stays after the cone has gone, with a few embers falling."

[layers]
count = "S1: 3 (the flame, the halo, the lit wax). S2: 2 to 3 stacked tongue layers. S3: 5: floor ribbon, cone, flare, rock chunks, brown cloud behind, plus spark streaks."
brightest = "S1: the middle of the teardrop (cream). S3: the cone's centre line and the star flare's heart."
colours = "S1: cream, pale yellow, orange rim, a little blue. S3: white-yellow, orange, red, with dark brown behind."
values = "S3 has three: white-hot core, orange body, dark brown cloud and rocks (a non-glowing layer behind the glowing one). S1 has a cream core with a darker orange rim and the black field."

[timing]
whole_effect = "S1 blow-out to relight: 13.4 to 21 s, 7.6 s; the flame itself is gone for 2.3 s."
