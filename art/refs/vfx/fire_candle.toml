[take]
structure = "A flame is a teardrop whose shape changes every few frames and whose edge is darker than its heart. It goes out by laying over, ballooning, stretching and vanishing, and it leaves a glowing wick dot for two seconds. For an attack, a four-point flare gathers it, a cone fires with a dark cloud behind, flecks of ember fly off, a ribbon stays on the floor."
do_not_copy = "The Unity pack's exact tongue shapes and star; use our own teardrops with ragged paper-like edges for the world's flames."

[weak]
unverified = "S1's puff was sampled every 0.38 s; the blow-out between samples is inferred from neighbouring frames. S2 is a macro of many flames at once and says little about a single flame. No smoke was seen above S1's wick; the video shows none."

