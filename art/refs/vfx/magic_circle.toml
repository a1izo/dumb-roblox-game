[moment]
gather = "S1 22.6-23.4 s: the pillar is on and the base is a small golden disc with a dark cracked ring of ground round it; the circle appears as a lit disc before any ring lifts off. 24.2 s: three stacked rings float above the disc, white lines with an orange tick ring, evenly spaced about one disc-width apart, each ring smaller toward the bottom. S2: no ignition in the clip (it loops from the start)."
hit = "S1 24.2 s: the rings are at their sharpest and brightest and the disc is a gold rosette at full glow; the rings tilt as they lift (the top ring becomes a hexagon at 25.0 s). S2 2.0-2.9 s: the rim's rays turn from magenta to near white for about one sample: the circle's brightest moments."
body = "S1 25.0-25.8 s (about 1 s): the rings lift and spread apart vertically, turning to look at an angle, the lowest ring still circling the disc. S2 (a loop, 10 s sampled): three or four concentric bands of tiny text-like marks drawn as thin white lines on a magenta glow; a hollow inner ellipse filled with a deeper violet; round the far rim a curtain of vertical streaks about a fifth of the ellipse's height, white at the base turning to magenta at the tips; the brightness of the rim breathes by a little between samples (whiter at 2.0 s and 2.9 s, deeper magenta at 4.7 s and 9.2 s), so a slow pulse of a few seconds, not measured."
breakup = "S1 25.8 s: the top ring is faint, the lower ones stronger: the stack leaves from the top first; 26.6 s: the rings are gone. S2: a loop, no ending shown."
residue = "S1 26.6-27.4 s (about 1 s): the cracked hole in the ground with the small gold disc still glowing at the bottom; at 27.4 s a few bright yellow spikes along the crater edge. A scorch or a crater with one lit mark stays behind the circle."

[layers]
count = "S1: disc, three rings, a crater with cracked ground (real geometry), the pillar beside it. S2: three: glyph bands, an inner violet ellipse, the ray curtain."
brightest = "S1: the gold disc. S2: the ray bases at the rim and the white lines of the bands."
colours = "S1: gold, white, orange ticks, brown rock, blue-green at night. S2: white lines, magenta glow, violet fill."
values = "S2: white lines (hot), magenta body, a dark black floor behind. S1: gold core, orange rings, dark crack lines round it."

[timing]
