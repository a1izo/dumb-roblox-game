frames_at_30 = "S1 gather 25, hit 6, body 30, break-up 25, residue 30"

[take]
structure = "A circle is not one picture: a lit disc first, then a stack of thin rings that lift off it in the air, tilt, spread, and fade top first, leaving a scorched mark with one glow. A standing circle is glyph bands on a glow with a curtain of rays at the rim and a slow pulse."
do_not_copy = "The glyph text, the rosette's exact pattern, the colours. For the game use pages, chalk, apple, crows' feathers as the marks (plan Part 3 point 8)."

[weak]
unverified = "S2's circle is cropped by the video frame at the sides and the bottom, so its full size and symmetry were not seen. The S1 ring order was read from four stills. A Roblox circle (the ReadyCircle in the game, or a Roblox game's) was not found as a reference."
