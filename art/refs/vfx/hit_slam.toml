# Hit and slam. Reference notes for the effects rework (docs/handoff/vfx-rework-plan-2026-11-16.md, ticket V0.4).
# Words are ours. The sheets beside this file are small contact sheets of frames, kept for internal reference only.
id = "hit_slam"
name = "Hit and slam: the frame a blow lands, and what is left after"
family = "hit_slam"
status = "watched 2026-11-16 in the built-in browser; times are seconds into each clip; frames are counted at 30 a second"
note = "Moments are a read of sampled frames (every 0.3 to 1.8 s), not frame-by-frame, so the shortest moments (the hit) are known only as 'under the gap between two samples'."

