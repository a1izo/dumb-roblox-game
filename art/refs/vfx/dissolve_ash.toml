[moment]
gather = "S1 22.5-27.0 s (4.5 s): the body is whole and the face is still; the camera holds on the face and a hand on the chest. Nothing on screen changes except a slow look. No particle precedes the first grain. S2 1.3 s: a match flame at the paper's corner: a small orange tongue, the first sign."
hit = "S1 28.5 s: along the collar, a ragged line of fine brown grains where cloth had been; the grain line is the dissolve front and it is hard to see because it is the same colour as the clothes. There is no flash. The 'hit' is the first line of grains. S2 3.3 s: the flame has taken the paper, billows twice the paper's size, white-hot in the middle and orange at the rim: the biggest moment."
body = "S1 29.5 s (about 1 s): the front has climbed from collar to chin; the grains are individual, about one or two pixels each, brown-tan, with a few bigger flakes; some lift off the cheek while the rest of the face is still skin. 30.5 s: the whole body is a cloud of grains shifting sideways, still holding the rough outline of a body, lit warm on the side facing the light. About 2.3 s (70 frames) from the first grain at the collar (28.2 s) to the head gone (30.5 s). S2 4.3-6.3 s: the paper is no longer there; the fire floats as a free-standing ball and sheet of flame, orange and white."
breakup = "S1 30.5-31.5 s: the grain cloud follows the wind, tilts and streams out to one side of the frame, thinning from the dense body to a spray. Break-up is by wind, and the density falls from the outside in. S2 7.3-15.3 s: the flame breathes in and out and shrinks; I could not tell when the paper was fully consumed."
residue = "S1 31.5-33 s (about 2 s after the last of the body): a few hundred tiny specks blowing diagonally across a wide shot of the next scene, sparse, spread over the whole frame; no pile. S2: no ash seen at all (flash paper burns completely)."

[layers]
count = "S1: one (grains), but of three sizes: fine dust, grains, a few flakes. S2: two (the white-hot core, the orange body)."
brightest = "S1: the lit side of the grain cloud. S2: the flame's core."
colours = "S1: brown and tan, the colours of the skin and clothes it came from (not grey). S2: orange, yellow, white."
values = "S1: grains lit warm on one side and dark in the lee. S2: white core, orange body, black field."

[timing]
whole_effect = "S1: 28.2 to about 33 s: 2.3 s of eating, 1 s of blowing, 2 s of sparse specks: about 5 s. S2: 17 s of burning with no end seen."
frames_at_30 = "S1 gather 135, hit 5-10, body 70, break-up 30, residue 60"

[take]
structure = "A body dissolves from an edge inwards in a visible front of grains that take the colours of what they were, then the whole becomes a cloud that wind carries, thinning from outside in, then a few specks cross the frame. The quiet look before the first grain is the gather."
do_not_copy = "The film's cinematography and sound (not recorded); do not copy the specific figure. For us the grains should be paper flakes and ash that take the owner's tier colour for shop effects (full colour, 2026-11-16)."

[weak]
ash = "S2 (flash paper) is a fire reference more than an ash one: it leaves no ash. No clip of real ash or a slow burn that leaves ash was opened. The anime 'Pokemon Ash turns into ashes' (GI6SE0RPudw, 24 s) and a Houdini breakdown (RRC5v0YASkA, 29 s) came up in search but were not opened."
unverified = "S1's grain count and speed were read from five stills; the grain front's edge was not measured."

