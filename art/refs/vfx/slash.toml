[moment]
gather = "S1 547.55-547.8 s: the sword turns and cocks back; no effect at all yet, the body is the gather (about 8 frames). 546.8-547.3 s: the sword sits still. S2 29.0-30.6 s: the player raises both arms; nothing is drawn."
hit = "S1 548.05 s: the whole slash is there at full size in one sample, a three-quarter circle round the blade's path: a bright white band in the middle of the stroke with a cyan edge outside and thin concentric curved streaks inside, a faint wide ring behind it, and a small curled tip at the top with six to eight snowflake specks. The peak white is the brightest thing. 277.0 s (plain slash): a pure white crescent with a thin tapering tail and notches cut into the inner edge, glowing past the floor's brightness."
body = "S1 548.05-548.30 s (about 8 frames): the crescent holds its shape but turns with the sword and thins; the curled tip lifts and spins. 274.0 and 275.5 s (the slash before it flashes): the same crescent in dim grey, semi-transparent, showing the notched inner edge and a pale gradient down the tail. S1's diagram 278.5-287.5 s: dark navy base shape, a lighter blue lead on the outside, a bright jagged inner edge; drawn once with a blue and once with a red lead. 324 s: the diagram with three thin streak lines trailing behind the crescent. S2 31.0-31.8 s: a flat white ribbon behind the arm, then a big flat white plane across the screen; one layer, no glow."
breakup = "S1 548.55 s (0.5 s after the hit): the crescent has gone into three thin grey curved lines and a few specks, like wind lines left behind a swing. The break-up is the shape thinning into streaks, then streaks fading; there is no hole-eating. 330 s: the slash drawn with dark brush streaks across the white (ragged strokes), a look that comes apart into strokes. S2 32.2-33.0 s: a thin white crescent beside the arm that shrinks and fades."
residue = "S1 548.8 s: one faint curved line and two or three white specks; 549.05 s: one speck; 549.3 s: nothing but the sword. About 0.75 s (about 22 frames) of thin leftovers. S2: none."

