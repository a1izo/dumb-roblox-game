[take]
structure = "A slash is a shape that is born full size on the hit frame, turns with the weapon for a few frames, thins into streaks, then into specks. Its layers are a white-hot band, a coloured band, thin inner streaks, a faint ring behind. An element (ice, fire, shadow) adds one small thing at the tip, not another big shape."
