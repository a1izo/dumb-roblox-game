[scene]
sentence = "At a crate by the roof's edge in the rain Diavolo looks down at a small chessboard, flicks the white king off it and over the parapet, watches it fall all the way down, throws his head back in the lightning, turns his back on the drop and stands facing the camera."
action = "The flick (2.7 s): a finger laid on the king, drawn back, one hard flick; he watches it fall 2 s."
