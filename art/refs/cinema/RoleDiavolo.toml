[origin]
what = "Light's potato chip scene (Death Note, episode 8): under L's hidden cameras he studies at his desk, eats crisps, and writes names on a page hidden in the bag; 'I'll take a potato chip... and eat it!'"
recognisable = "The hand writing on the hidden page; the tiny TV with a criminal's face; the crisp raised slowly in a frontal medium shot, elbow out; a low three-quarter close with half the face in shadow for the bite, glittering crumbs; Ryuk laughing in the dark behind; then the surveillance monitor's view from behind: an ordinary student."
ours = "Rebuilt from scratch 2026-10-28: writing and a crisp; the name; the eyes up to the television, the flatline; the crisp raised beside the face and held; EAT IT with a red still and the crumbs; leaning back laughing as the Deathsinger forms behind him; then the hidden camera's black-and-white view of a good student writing, nothing behind him."

