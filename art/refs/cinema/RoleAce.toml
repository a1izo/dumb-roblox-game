# Ace's role scene (shot RoleAce). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "RoleAce"
name = "Ace: the tea and the turn"
status = "rebuilt 2026-11-14 (the pilot of docs/handoff/animation-cutscene-plan-2026-11-13.md)"

[scene]
sentence = "Ace sits curled up alone in the dark, as still as a stone and doing small exact odd things without looking (a sugar cube stacked on a tower, a cup taken by its rim), hearing that Kira can kill from afar; on the last words, 'in person', his head snaps round to the lens: he knows he is being watched."
action = "Stillness broken by small precise odd movements (the blind reach, the pinch, the stack), then ONE sharp turn of the head to the lens on the line's last words, and a stare held."
mood = "A mystery scene: slow cameras that creep in on a still figure, the screens' glow the only light, no strikes, no crash zooms (cutscene-quality-bar round 14)."

[origin]
what = "L (Death Note): the way he sits, picks things up and looks, as the anime first shows it in episode 6 (his face first seen), plus the sweet-eating moments cut together in a compilation. The line itself is episode 2's (L speaks it through a voice changer over his logo, he is not shown), so the staging is ours."
recognisable = "Crouched in an armchair, knees drawn up to the chest, arms resting on or hugging the knees; a cup lifted by its rim between finger and thumb; sweets pinched between finger and thumb and eaten without hurry, eyes wide and flat; then a slow, unblinking turn of the face to the lens, extreme close, the eyes wide; low angles; slow stills of him."
ours = "The set stays (maps/venues/sets/ace.py: the wall of screens, the club chair, the low table, the pantry door); the story stays (the briefing line, the Butler brings the tea). Everything acted, shot and lit is new: a tower of sugar cubes on the table, a blind reach to the tower, a cup taken by its rim, the head turned to the lens on 'in person'."

