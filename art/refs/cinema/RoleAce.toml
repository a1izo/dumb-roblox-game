[timing]
length = 17.5
fit = "6 cuts of 2.4 to 4.1 s, none under 1.5 s: A 0.0-3.6 the stillness (low, from beyond the table, creeping in, the figure small and lit by the screens, the first small odd movement a slow head tilt); B 3.6-6.0 the screens' side, close, the head jumping screen to screen with long holds; C 6.0-8.4 the blind reach to the tower of sugar cubes, a follow that starts on the table and ends at his lips; D 8.4-11.0 the Butler's tea: the pantry's warm light, over Ace's shoulder to the door, the cup taken by its rim without a look; E 11.0-13.4 the cup at his lips, profile, then on 'in person' the head snaps to the lens; F 13.4-17.5 the stare held, a slow creep in, one last small tilt."
lens = "Low (the eye a little under his), fov 30 to 40 from 5 to 8 studs for the face; wide fov 48 to 56 only for the room; everything creeps or drifts by hand (shot.pan operator), never locked; something in the foreground in most cuts (the table's edge, the chair's wing, the cup)."
light = "The screens are the only light: cold blue-white from the north wall as a rim and a flicker on his face; one warm shaft from the pantry door when the Butler enters."

[r6]
notes = "R6 has no knees or fingers: the crouch is the accepted one (thighs out along the seat, torso upright on them, plus a joint slide to tuck the shins); the pinch is a fist with a sugar cube welded to it, put on the cube with body_reach and checked by number; the head leads every turn and the torso follows 2 to 4 frames later; both arms never alike; the face stays up to the lens for the close shots (a bowed head is only hair)."

