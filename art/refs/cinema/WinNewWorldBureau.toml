# The Bureau's New World win cutscene (WinCuts.newWorldBureau, clip winNewWorldBureau). Reference notes.
id = "WinNewWorldBureau"
name = "God of the New World, for the Bureau: the Manual raised over the press"
status = "redone 2026-11-24 (cameras, light, the ending pose, the free arm); the old acting is art/scripts/emotes/wins_old.py; data in src/shared/Cinema/WinCuts.luau"

[scene]
sentence = "Ace comes down to the courthouse's top step with the Manual shut at his side, takes it in the right hand, raises it high over the press as the screens across the square show the news and the cameras go off, turns it to one side and the other, and brings it down beside his head, the cover to the world."
action = "The raise (2.55 to 3.3 s): a dip first, then the right arm straight up with the Manual, the sun on his face, the flash at 3.55."
mood = "Daylight and columns; a triumph that is public: flashbulbs, a bell at 6.6 s."

[origin]
what = "'I'll become the god of the new world' (Death Note), the Bureau's reading: the case won in public, the book held up as evidence, not as a weapon."
recognisable = "A single figure on steps between columns, one arm high, a crowd below."
ours = "R6 on the 'steps' room: six columns, the press (cameras on tripods) 16 studs ahead, a sun behind them."

[source]
url = "https://www.youtube.com/watch?v=XVd6ngs8Fr4"
title = "I'll Become The God of This New World | Death Note (107 s)"
kind = "the anime scene (movie opening)"
watched = "2026-11-24: contact sheets over 2-100 s, 27-44 s and 71-94 s: the figure standing very still, backlit, then the close shot of the eyes; the raise itself is not in the clip and is staged from the story."
mirror = false

