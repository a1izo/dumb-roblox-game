# The Campus intro (shot IntroCampus). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "IntroCampus"
name = "Campus: the exam hall"
status = "built"

[origin]
what = "The Death Note falling in Death Note, episode 1: Light, bored in class by the window while the others work, sees a black notebook drop past outside and land in the schoolyard."
recognisable = "The class bent over its work, Light chin in hand looking out; a view along the building's windows as a dark shape falls past; his eyes catching it; the notebook tumbling close; a wide of it landing; an extreme close on his eyes."
ours = "Rebuilt from scratch 2026-10-28: the entrance exam at midnight, thirty candidates a desk apart, each their own rhythm and habit (16 looping clips of different lengths, every desk offset; the owner: never the same animation in step); one player by the side door, finished, chin in hand; the book drops out of the night past the lamp over the door, he snaps round, it lands in the snow; a close stare; nobody else looked up."

[source]
url = "https://www.youtube.com/watch?v=2GA3fCQu1dA"
title = "Light finds Death Note Scene"
kind = "the anime scene"
watched = "2026-10-28: frame sheets every 5 s over 0-100 s and every 1 s over 0-20 s, in the built-in browser"
mirror = false

