# The Campus intro (shot IntroCampus). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "IntroCampus"
name = "Campus: the exam hall"
status = "built"

# Step 2 of the animation plan (docs/handoff/animation-cutscene-plan-2026-11-13.md), written 2026-11-15 for the re-act.
[about]
sentence = "At midnight the whole exam hall is bent over its paper, and the one candidate who has already finished, bored and sunk in his seat, is the only one who sees a black book fall out of the night; he wakes in one move, faces the door and stares, while everyone else keeps writing."
action = "A body gone slack with boredom is jolted awake: the twirling pencil stops dead, the whole torso and head whip round to the door as one move, and then he holds there, leaning towards it, as the rest of the hall carries on."
cuts_stay = "The owner liked this scene's structure (a re-paced version was called ruined and reverted, the verdict before that was fine but bland). Same nine cuts, same lengths, same set, same order and same story. Re-acted: every pose, every camera move and the light on every actor."

[origin]
what = "The Death Note falling in Death Note, episode 1: Light, bored in class by the window while the others work, sees a black notebook drop past outside and land in the schoolyard."
recognisable = "The class bent over its work, Light chin in hand looking out; a view along the building's windows as a dark shape falls past; his eyes catching it; the notebook tumbling close; a wide of it landing; an extreme close on his eyes."
ours = "Rebuilt from scratch 2026-10-28: the entrance exam at midnight, thirty candidates a desk apart, each their own rhythm and habit (16 looping clips of different lengths, every desk offset; the owner: never the same animation in step); one player by the side door, finished, chin in hand; the book drops out of the night past the lamp over the door, he snaps round, it lands in the snow; a close stare; nobody else looked up."

[source]
url = "https://www.youtube.com/watch?v=2GA3fCQu1dA"
title = "Light finds Death Note Scene"
kind = "the anime scene"
watched = "2026-10-28: frame sheets every 5 s over 0-100 s and every 1 s over 0-20 s, in the built-in browser. Watched again 2026-11-15 for the re-act: sheets at 1 s over 0-15 s, at 0.2 to 0.4 s over 8.4-12.8 s and 13.4-21 s."
mirror = false

# What the second watching showed that the first notes missed: Light never turns his head to the book. He stays dead
# still, chin sunk in the palm, and only his eyes move. The notebook is shown to us, tumbling slowly big in the frame
# with its cover turning to the lens, and the camera cuts between his stillness and its fall. Our noticer does turn
# (the owner's story: he is the one who sees it), so the stillness before the turn is the part to copy exactly: it is
# what makes the turn read.

[[beat]]
src = 0.0
pose = "wide from the back of the room: rows of heads bent over desks, pencils moving, Light small at the back with his chin on his hand, the one head that is not bent"
[[beat]]
src = 1.3
pose = "Light at his desk by the window, chin in hand, classmates writing"
[[beat]]
src = 3.0
pose = "close: his cheek sunk in the palm, the elbow planted on the desk, the shoulders dropped and the whole body leaning to that side, eyes half-lidded and looking at nothing"
[[beat]]
src = 5.0
pose = "the same hold, dead still but for a slow blink; the head's weight all on the hand; the other classmates a blur behind"
[[beat]]
src = 7.3
pose = "outside, along the building's windows: a dark shape drops into the top of the frame"
[[beat]]
src = 8.4
