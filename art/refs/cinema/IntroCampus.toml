[[beat]]
src = 18.3
pose = "extreme close on his eyes and mouth, a finger at the lip, sharp interest, nothing else moving"

[timing]
length = 22.6
fit = "9 cuts and the card: the hall (0-4); the aisle (4-6.8); him, finished, bored (6.8-9.6); outside, it drops out of the dark (9.6-11); falling past the lamp (11-12.6); his head snaps round (12.6-13.6); it lands in the snow, the lit arch beyond (13.6-15.8); his stare (15.8-17.8); the hall, only he turned (17.8-19.6); black and the case's card."
lens = "the hall: high and wide, creeping; the aisle: low and long; him: a long lens in front, pushing in, the face and the shoulders; the fall: low looking up the wall, then close on the book with a lazy turn; the snap: close, a hand-held jolt; the landing: low in the snow; the stare: tighter and tilting; the last: a wide pull back that shows the hall behind him still writing."

[r6]
notes = "Bodies at exam desks sit perched (thighs sloping under the rack); hands placed with body_reach on the paper; the candidates use every other desk (an R6 body with arms is 4 studs across, the desks 3.6 apart). Extras wear the crowd's civilian bodies (LCrowd, now built on the campus too). A straight R6 arm propping the chin hides the face from a camera on that side (r6-near-arm-occlusion): the chin goes on the FAR arm (his left, from a camera on his right), so only the fist shows beside the cheek."

