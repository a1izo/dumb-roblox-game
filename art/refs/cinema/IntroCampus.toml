[r6]
notes = "Bodies at exam desks sit perched (thighs sloping under the rack); hands placed with body_reach on the paper; the candidates use every other desk (an R6 body with arms is 4 studs across, the desks 3.6 apart). Extras wear the crowd's civilian bodies (LCrowd, now built on the campus too)."

[check]
