[[beat]]
src = 9.3
pose = "his eyes catching it: back on Light, the head and the hand still dead, only the eyes slide right and down, the brows barely moving"
[[beat]]
src = 10.2
pose = "the notebook fills the frame, tumbling slowly, dark against the brick and light, edge on"
[[beat]]
src = 11.3
