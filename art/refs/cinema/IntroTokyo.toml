# The Tokyo intro (shot IntroTokyo). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "IntroTokyo"
name = "Tokyo: the platform"
status = "built"

[origin]
what = "Raye Penber's death in the subway (Death Note, episode 9): the heart attack at the train's doors while Light watches from inside the car."
recognisable = "A man seizes up at the train's door, clutches his chest, sinks to his knees on the yellow strip with his bag on the floor beside him, falls; from the floor, the one in the car looks down at him, face in shadow, the faintest smile; the doors close."
ours = "Both are random players and nobody dies (the owner's intro idea): the victim falls and struggles; the Manual lies on the floor beside him where Raye's briefcase lay."

[source]
url = "https://www.youtube.com/watch?v=zwarit0gXE8"
title = "Light Kills Raye Penber by a Heart Attack | DEATH NOTE 4K"
kind = "the anime scene, the whole subway sequence"
watched = "2026-10-27: frames every 2 s over 16-72 s in the built-in browser"
mirror = false

[[beat]]
src = 18.0
pose = "Raye in the lit doorway of the car, his back to us"
[[beat]]
src = 24.0
pose = "at the door's frame, one hand clutching the chest, doubled over"
[[beat]]
src = 28.0
pose = "his face from above, agony, mouth open"
[[beat]]
src = 32.0
pose = "on his knees on the yellow tactile strip, the briefcase on the floor beside him"
[[beat]]
src = 34.0
pose = "fallen forward, face down"
[[beat]]
src = 36.0
pose = "from the floor: the car's window, the figure inside"
[[beat]]
src = 38.0
pose = "Light, close, face in shadow, the faintest smirk"

[timing]
length = 23.0
fit = "Our station has full-height glass screen doors: the car pulls in, both sets of doors open, and the man in the car stays aboard, two studs back from the doors. As in the source, the Manual is his, not the victim's: he is reading it as the doors open and shuts it while he watches. 8 cuts: the arrival (0-5), the look up from the book into the doors (5-8), the clutch (8-12), the knees and the fall in place (12-15), low along the body to him looking down, dutch (15-17), the insert of the book shut by his other hand (17-18.4), the smirk, dutch the other way (18.4-20.4), the train leaving with nobody having looked up (20.4-23). Motion blur follows the camera and pulses on the jolt, the fall and the departure. The platform lives: people on phones, a pair talking, someone walking straight past him."

[r6]
notes = "Hands placed with emotes.kit.reach (the clutch at the chest, the palm on the glass); the knees with acting.kneel; lying down is the root pitched over with the body on the floor."

[check]
by = "run_cinema --lint and --clear (no actor into the glass, the train or another), contact sheet at every cut"
