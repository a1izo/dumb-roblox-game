[timing]
length = 24.6
fit = "Cause and effect first (the owner, 2026-10-28): B shows the writer writing as the doors open, W the pen finishing the name, and C cuts hard on the jolt. 9 cuts: the arrival (0-5), the writer writing (5-7.4), the pen's last stroke (7.4-8.2), the jolt, frozen, the look up, the knees (8.2-12), the fall under gravity (12-14.6), low along the body to him looking down, dutch (14.6-16), the book shut (16-17.2), his head coming up to us smiling, dutch the other way (17.2-18.6), low on the car floor at the victim reaching out as the doors close over a riser (18.6-21.6), black: half a second of silence and the case's card (21.6-24.6). Heartbeat pulses at the edges and a slow drain of colour from the jolt to the black; motion blur on the jolt and the hit."

[acting]
url = "https://www.youtube.com/watch?v=LBxUsAzjL84"
what = "How to Faint Safely on Stage: the side-view knee drop at 212.1-214.0 s."
taken = "The knees buckle and the body drops straight down, upright, in 0.7 s (212.1 standing, 212.8 knees down), then settles back onto the heels with the head drooping (213.4-214.0). Nothing thrashes: the owner found the old seizure shaking 'from the wrong places' (the head thrown back, the arm flung). The forward fall from the knees is a simulated topple (theta'' = 3g/2L sin theta, g 35 studs/s², L 3.6 studs: 0.57 s down, the chest bouncing back 12% of its speed)."

[r6]
notes = "Hands placed with emotes.kit.reach (the clutch at the chest, the palm on the glass); the knees with acting.kneel; lying down is the root pitched over with the body on the floor."

[check]
by = "run_cinema --lint and --clear (no actor into the glass, the train or another), contact sheet at every cut"
