[scene]
sentence = "Diavolo in the detective's armchair before the fire reads the case file, shuts it, throws it on the flames, laughs with a palm over the face as the string wall burns, and ends with the chin on a fist, watching it burn."
action = "The throw (3.2 s): drawn back, then one snap of the arm; the file in the fire, and the laugh that follows it."
mood = "Fire-lit, slow-burning, then gleeful; the laugh builds from a bowed head to a head thrown back, then it goes quiet."

[origin]
what = "Kira's laugh (Death Note, the warehouse): the head bowed and shadowed, then thrown back with a wide mouth and a red eye, and a small figure held in a lit hall afterwards."
recognisable = "The bowed head, then the head back; the figure alone and still at the end."
ours = "R6 in an armchair in the 'den': a fire ahead, the evidence board burning on the left wall."

