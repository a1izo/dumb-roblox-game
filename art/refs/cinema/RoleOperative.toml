# The Operative's role scene (shot RoleOperative). Reference notes, kept the way art/refs/cinema/RoleAce.toml keeps theirs.
id = "RoleOperative"
name = "Operative: gearing up"
status = "rebuilt 2026-11-17 (item 1b of docs/handoff/animation-cutscene-plan-2026-11-13.md); the old module art/scripts/cinema/shots/role_taskforce.py is kept, unimported"

[scene]
sentence = "A Bureau agent alone in the locker room before the night's work takes each thing from the locker, checks it and puts it on (the badge first, then the cuffs, the earpiece, the tie), and each one makes them a little less a person and a little more the Bureau; they close up, turn, and walk out through the door."
action = "One person, one routine done with weight: reach up into the locker, take the badge, check it in the light, put it away; every later item is the same take-check-wear in fewer, surer movements, ending on the turn and the walk out of the door."
mood = "Cold, quiet and exact: a long lens, slow held cameras, the fluorescent room's one warm point in the open locker. Nothing is fast; the weight of the gear is in the body (a settle on every item). No strikes, no crash zooms (cutscene-quality-bar round 14). The captions (YOU ARE / YOUR RULES / YOUR ALIAS) sit low left, so the subject lives on the right and high."

[origin]
what = "Real gearing-up scenes: the squad-room locker scene of the film End of Watch (a body camera checked and clipped on, the armour vest strapped, the badge pinned over the heart), the way a film shows a kit put on item by item with inserts on the hands, and a filmed look at how a real badge wallet opens (a bi-fold black leather case, the shield in a cut-out on one side, the ID in a window on the other)."
recognisable = "Standing square to a locker, the first reach up and in without looking; the object turned over in the hand and checked as a thing that matters; the click or the snap of a catch; a hand at the chest to settle the thing under the jacket; the head tilting to listen to an earpiece; the tug that squares the jacket and tie; the last glance at the empty locker; the turn; the walk to the door."
ours = "The set stays (maps/venues/sets/locker.py: the open eighth locker with its shelf and hook, benches, the seal on the west wall, the door in the south wall). The scene stays alone (nobody else in the room). Everything acted, shot and lit is new. The badge (Core prop BureauBadge) is the hero insert: a close shot in a moving raking light."

