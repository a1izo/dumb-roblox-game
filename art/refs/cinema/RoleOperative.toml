[badge_real]
filmed = "Black pebbled leather case, folded; the shield (silver or nickel, domed, with an engraved rim and lettering) sits in a recessed cut-out on one half, the ID card in a clear window on the other. It is opened by thumb and finger and shown by turning the whole case flat to the person it is shown to; metal catches the light on its raised edges and engraved lines first, the enamel and leather stay dark."
ours = "BureauBadge: stitched black leather with a fold, a gold shield with a beaded rim and a scalloped crown, a blue enamel seal with a star, THE BUREAU on its ribbon and the number 0417 on its foot, and the ID card in its window on the left half."

# The poses, each with its source (S1 = End of Watch, S2 = the badge wallet clip, S3 = Zero Dark Thirty) and its time.

[[beat]]
src = "S1 0-12"
pose = "A man in a bare T-shirt stands square to the lens in front of the lockers, hands low, shifting his weight, eyes down, as still as a man deciding: the room before the routine."
[[beat]]
src = "S1 30-36"
pose = "The head turns and dips towards something at his chest; the shoulders drop a little; one hand comes up to the kit he is about to wear."
[[beat]]
src = "S1 39-42"
pose = "A small device is held out at arm's length in front of the lens, thumb working it, then turned over and looked at close: check it before you wear it."
[[beat]]
src = "S1 42-48"
pose = "Both hands come in to the chest together and fix the device on, elbows out, head bowed over the work, then the head comes up: the click that says it is on."
[[beat]]
src = "S1 86-92"
pose = "A man in a vest, side on, one forearm across his belly, the other hand strapping the vest at his ribs: weight settles into the hips as each strap is pulled tight."
[[beat]]
src = "S1 98-101"
pose = "Close on the chest: both hands pinch the badge over the heart and press it through the cloth, head bowed over them, then a glance at it."
[[beat]]
src = "S1 108"
pose = "A wrist is turned to look at a watch; the other hand tugs the cuff: the last small checks before leaving."
[[beat]]
src = "S2 4-8"
pose = "The wallet is held shut in one hand at chest height, back to us (leather only); a thumb and finger take its edge."
[[beat]]
src = "S2 10-15"
pose = "The case is opened and turned to face the lens: the shield on the right half takes the light on its rim, the ID window dark on the left; the hand tilts it a few degrees and the shine moves across the metal."
[[beat]]
src = "S2 18-24"
pose = "The ID flap is lifted and flicked back; the case snapped shut and turned away: the whole check takes seconds and ends in a closed hand."
[[beat]]
src = "S3 145-165"
pose = "Cutting rhythm: a wide of the group and then, on the same action, a tight insert on a hand closing on the kit; the insert is held long enough to read the object."
[[beat]]
src = "ours 12-15"
pose = "The last look at the open locker (the empty shelf), one breath, then the turn on the heels; the head leads the body."

[cuts]
# As built (the order of the items changed while blocking: the cuffs first, then the badge, so the face beats come after the turn to the room)
A = "0.0-2.8 low wide from the west corner, creeping in: the open locker and the still figure facing it; the head lifts to the shelf, the left hand goes up"
B = "2.8-5.2 from the east flank at head height, long lens: the cuffs taken off the shelf's lip, looked at (they swing), clipped on behind the left hip"
E = "5.2-7.7 from behind on the right: the badge case taken off the shelf, brought down, the step back and the turn to the room with it"
C = "7.7-10.1 the badge insert: a slow arc round the case in the left hand, leather first, then the shield tilted through a raking warm light; THE BUREAU and the number 0417 read"
D = "10.1-11.9 straight on from the front: the case goes inside the jacket with a pat, the jacket settles"
F = "11.9-13.7 close from the door, long lens: the head tilts to the earpiece's tone, a hand at the lapel"
F2 = "13.7-15.3 from the front left, low: the tie squared, both hands tug the jacket hem, the last look at the open locker"
G = "15.3-19.0 wide and low from the north-west: the walk the length of the room to the doorway and out; the last 0.4 s cut to black for the role card"


