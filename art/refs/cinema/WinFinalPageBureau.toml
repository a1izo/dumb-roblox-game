# The Bureau's Final Page win cutscene (WinCuts.finalPageBureau, clip winFinalPageBureau). Reference notes.
id = "WinFinalPageBureau"
name = "The Final Page, for the Bureau: the last page burned, the book sealed"
status = "redone 2026-11-24 (cameras, light, the burning page held beside the face); the old acting is art/scripts/emotes/wins_old.py; data in src/shared/Cinema/WinCuts.luau"

[scene]
sentence = "At the archive's table at dawn Ace reads the Manual's last page, tears it out, strikes a match and burns it, then shuts the book and seals it in an evidence bag, and straightens into the light with a hand left on the bag."
action = "The tear (2.45 s): a grip on the page, pressed down, then ripped up in one snap with the torso answering."
mood = "Procedure as victory: hands that are exact, a dawn key on the face, the flame the only warm thing; the ending is quiet."

[origin]
what = "L's exact hands (Death Note): a thing taken up and handled between two fingers; the writing scene's pen hand and close inserts; the evidence bag is the Bureau's own."
recognisable = "Small exact movements, a page held up beside the face, a match struck away from the body."
ours = "R6 standing over the archive's table; the open Manual, the last page, a matchbox, the evidence bag."

[source]
url = "https://www.youtube.com/watch?v=kAHNiJ9T2-M"
title = "Yagami Light | Death Note Writing Scene (39 s)"
kind = "the anime scene (for the close inserts on the hand and the overhead on the desk)"
watched = "2026-11-24: a 16-frame contact sheet over the clip. No clip of a page being burned was watched: the burn is staged from the story."
mirror = false

