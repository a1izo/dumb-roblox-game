# The Butler's role scene (shot RoleButler). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "RoleButler"
name = "The Butler: the tea carried in, and the question"
status = "rebuilt 2026-11-17 (item 4 of docs/handoff/list-2026-11-16.md, the plan's step 1c); the old module art/scripts/cinema/shots/role_watari_old.py is kept, unimported"

[scene]
sentence = "The old servant Watari sets his tea tray straight with small exact movements in his pantry, carries it level and unhurried into the dark room of the one he serves, sets it down with a small bow, his hand flat on his chest, and, seeing that the crouched shape among the screens is silent, asks gently: 'Is something the matter? Hmm? ... What's wrong?'"
action = "The tray: taken up with exact hands, carried level on a still upper body through the door, lowered and put down (one small dip), and the hand to the chest with the head inclined as he asks. Stillness above the belt, tidiness below it."
mood = "Quiet and kind, a little uneasy. Warm pantry light against the cold screen glow of the other room; slow held cameras, nothing sudden; the answer never comes."

[origin]
what = "Watari (Death Note): the old gentleman who is L's servant and handler. Seen in the anime when he introduces himself to the Japanese task force (episode 6, 'Unraveling': he stands behind L's armchair, touches the brim of his hat, takes it off and lays his hand flat on his chest with a small bow, then opens the case of badges on a little round table and hands each one over between two fingers), and in every scene where the tea things stand on the low table beside L."
recognisable = "Grey-white hair brushed back, round glasses, a white moustache, the dark suit with a white shirt and a thin black tie; very upright; the head inclined a little; eyes nearly closed in a gentle smile; a hand held flat against the chest; the hands joined low in front of the belt when he stands; things given with two fingers."
ours = "The set stays (maps/venues/sets/ace.py: the pantry and Ace's room beside it) and so does the line (the Butler's: 'Is something the matter? Hmm? ... What's wrong?'). Everything acted, shot and lit is new: the tray taken up, the carry through the door, the table, the hand to the chest, the question, the release."

