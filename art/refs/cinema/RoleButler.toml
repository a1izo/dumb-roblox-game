[timing]
length = 12.0
fit = "6 cuts, none under 1.5 s: A 0.0-1.7 low from the pantry's east end, wide (fov 56), the old man bent over the tray, a fist touching a cup straight, the doorway and the dark room's armchair in the distance behind him; A2 1.7-3.3 an insert close and high from the west over the tray: the two fists taking it by its ends, the lift (the teapot and the cups lit in the foreground); B 3.3-6.3 high from the pantry's far corner behind him as he goes, down its length to the lit door and the faceless one in the chair beyond; C 6.3-8.5 from the dark room, low, past the armchair, back along the line to the door: he comes through carrying the tray on one hand and the question begins; D 8.5-10.2 from the front-left, the old man stopped, the tray held, the head inclined, the left hand flat on his chest on 'What's wrong?'; E 10.2-12.0 from inside the pantry through its two doorways: him small and still, looking to the screens, the faceless one not answering; a cut to black at 11.65. The line starts at 6.0 s as he reaches the doorway and ends about 9.6 s."
lens = "Low (about the servant's chest to eye height), fov 30 to 40 for him, 46 to 50 only for the rooms; every camera creeps or drifts by hand (shot.pan operator), none locked; something in the foreground in most cuts (the counter's edge, the trolley, the chair's back)."
light = "The pantry's own warm pendant; a key on his face from the counter side, a cool rim from behind in the dark room so his outline separates from the wall; the screens' glow is the room's own; the warm spill of the door follows him in."

[r6]
notes = "R6 has no elbows or fingers: the tray is carried between both forearms held forward at the belt, welded level (keep_arm); the hand to the chest is a fist put on a mark on the torso with body_reach; the exact hands are fists put on marks (the cup's handle, the tray's ends); the head stays up (a bowed head is only hair), the bow is the whole body dipping 12 degrees and the neck level; the walk is slower than the game's (3 studs a second), eased in and out, the heading turned into the table over the last seconds (a curve, no pivot after the stop), never both arms alike."

