# The Agency intro (shot IntroAgency). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "IntroAgency"
name = "Agency: night watch"
status = "built"

[origin]
what = "The task force's surveillance in Death Note: investigators in a dark room watching rows of camera feeds, the clock running, nothing happening, until something does."
recognisable = "A dark room lit only by monitors; a bored operator clicking through cameras; a feed that should show something and doesn't; the replay; the alarm."
ours = "Rebuilt 2026-11-02 after the owner's notes on the last version (why would they watch the Manual, why would it teleport, why would the killer bring it to them, not everyone at the monitors). Two on the night watch flick through the building's cameras: the others are spread round the building (break room, night desk, copy room, bullpen) doing their own thing. The evidence room's feed breaks up and clears on an empty counter; the replay shows a faceless figure in a suit lifting the Manual and walking out. The alarm: every room looks up into its camera. Last, the floor upstairs: the figure walking off with it stops and turns its head to the lens; static; black. The owner chose this ending ('both')."

[timing]
length = 22.6
fit = "A: the two at the wall of feeds, from behind (0-2.2); B-E: the feeds, one click each: break room, night desk, copy room, bullpen (2.2-6.8); F: the watcher, bored, from the end of the console (6.8-8.2); G: the evidence feed, the Manual on the counter, breaking up, then gone (8.2-10); H: the two jolt and lean in (10-11); I: the replay, the figure takes it (11-12.8); J: from behind, he slams the alarm, red (12.8-13.8); K: each room looks up into its camera (13.8-17); L: the floor upstairs, the figure stops and turns its head to the lens, static (17-19.6); black and the card."

[r6]
notes = "Twelve only. Two seated at the console; ten spread over four rooms, each with their own clip and their own fidget timing (no two in step). The figures are faceless stand-ins (extras), never a player. The console's monitors come out to x -61.3 between y 4.4 and 7.2: there is no room for a camera in front of the two, so their close shots come from the console's end (about -61.9, 4.9-6, -60.4), three-quarter on. The feeds are the cctv fx over locked cameras."

[check]
by = "run_cinema --clear 0 problems; --lint clean; contact sheets of every cut; acting file 194,998 characters after the loosening (idle breath only while each person is on camera) (stale IntroAgency_crowd* and walker* pruned from Animations.blend). Still to watch in Studio (the owner saw clipping the Blender check missed in an earlier version)."

[acting]
notes = "Loosened 2026-11-02 (the owner: 'the entire movement is stiff'). Each person plays one big readable action while their feed is up (a laugh, a story told with both hands, a long drink and a look round, down to the vending tray and up, a stretch, fast writing then a step back, a jammed copier jabbed then slumped on, jabbing at papers, a head shake and a shrug, slapping the board); moves use anticipation, overshoot and quick strikes between holds; the springs are looser. At the alarm: a flinch, the head snaps up into the lens and the body follows. The second watcher dozes and jerks awake; the walking figures swing the free arm."

[camera]
notes = "Reworked 2026-11-02 (the owner: 'the cinematography needs work'). The building cameras are PTZ units: each feed opens on the people in its room and pans and zooms slowly over them; at the alarm each room's camera crash-zooms onto a face as it comes up (aimed with framing.part at the head's real place); the evidence camera creeps onto the Manual before the feed breaks up; the replay follows the figure out; upstairs a crash zoom onto the figure's head as it turns. In the office: the opening draws back from the glowing wall of feeds over the two; the jolt is a fast low push between their chairs; the alarm is shot from behind, dutch, punching in on the slam. An insert of the hand on the alarm was tried and dropped: from the only free spot (the console's end) the watcher's hair and arm fill it."

[tone]
notes = "2026-11-02, the owner: the new cinematography is better 'but too comical instead of deep and mysterious'. Crash zooms, the punch-in, heavy handheld shake and gag timing in the acting (jab jab jab and a slump at the copier, a head shake and shrug, dozing and jerking awake, flinch-and-snap look-ups) read as sitcom. Now: every camera slow and steady (handheld barely breathing), the building's cameras creep in on a face instead of crash-zooming, the alarm is a slow push from behind; the people go about quiet business (a quiet laugh, a story told low, a finger along a line, a slow look at the dark window) and at the alarm go still, then slowly raise their heads to the lens. Acting file 163,073 characters."
