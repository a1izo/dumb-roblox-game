# The Agency intro (shot IntroAgency). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "IntroAgency"
name = "Agency: the operations deck"
status = "built"

[origin]
what = "The task force's first night with L (Death Note): a dark room, the case's evidence spread out, the investigators lined up watching, and L crouched on a chair, thumb at his lip, staring at it."
recognisable = "L crouched, thumb at the lip, extreme close-ups of his eyes; inserts of the evidence (crime-scene photographs, notes with arrows, a badge); low, cold light; the team in a row watching him."
ours = "Rebuilt from scratch 2026-10-28: the match's players (twelve at most) round the map table in one pool of light; one crouched on a chair at the table's far end, thumb at his lip, staring down its length at the Manual at the other end; the reader lifts its cover, the lights stutter, the wall of the dead across the atrium flares and every head snaps up; the crouched one unfolds and stands; the camera comes straight down into the open page."

