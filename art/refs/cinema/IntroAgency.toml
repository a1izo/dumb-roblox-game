# The Agency intro (shot IntroAgency). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "IntroAgency"
name = "Agency: it's in the building"
status = "built"

[origin]
what = "The task force's surveillance in Death Note: investigators in a dark room watching rows of camera feeds (the cameras in Light's house), the clock running, nothing happening, until something does."
recognisable = "A dark room lit only by monitors; tired faces in their glow; a feed that should be empty; the realisation."
ours = "Scrapped and rebuilt a third time 2026-11-01 (the owner chose the idea), then told so it makes sense 2026-11-02 (the owner: why would they watch it, why would it teleport): the team on a night watch over the evidence room's feed, the recovered Manual on its counter; the feed breaks up and clears on an empty counter; on the replay a faceless figure in a suit takes it; this room's own camera zooms onto the duty desk behind them, the Manual on it (there from the first shot): one of them took it; they turn to it, then look at each other."

[timing]
length = 22.6
fit = "12 cuts and the card: behind them at the feeds (0-2.6); over the console along their faces (2.6-4.4); the evidence feed, the Manual on the counter (4.4-6); the watcher leans in (6-7.2); the feed breaks up, the counter empty (7.2-9); they jolt (9-10.6); he runs the tape back (10.6-12.2); the replay: a figure takes it (12.2-14.2); this room's camera zooms onto the desk behind them (14.2-15.6); his face, turning (15.6-16.6); from behind the book, all turned to it (16.6-18.2); they look at each other (18.2-19.6); black and the case's card."

[r6]
notes = "Twelve only, nobody walks (two seated at the console, ten standing crowded behind it a body's width apart); they turn round on the spot (the path turns them, the neck takes the rest). The duty desk's monitor walls its south end: the book sits on its papers at the north end, and the shots from behind it come from the north. The feeds are the cctv fx over locked cameras."

[check]
by = "run_cinema --clear 0 problems; --lint (close-ups only); contact sheets of every cut; to watch in Studio before calling it done (the owner saw clipping the Blender check missed in the last version)"
