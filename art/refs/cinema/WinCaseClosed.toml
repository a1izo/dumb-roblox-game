# The Bureau's Case Closed win cutscene (WinCuts.caseClosed, clip winCaseClosed). Reference notes.
id = "WinCaseClosed"
name = "Case Closed: the strings snap, the stamp comes down"
status = "redone 2026-11-24; the old acting is art/scripts/emotes/wins_old.py (unimported); the data is src/shared/Cinema/WinCuts.luau"

[scene]
sentence = "The detective crouched on his chair watches the evidence board's strings snap one by one, then pins the case file with one hand and slams the stamp down with the other, and eats a sugar cube with the thumb at the lip."
action = "The stamp: brought up high with the other hand pinning the file's corner, held a breath, then slammed (4.8 s) with the whole body dropping on it."
mood = "Dry and exact. Cold lamp over the desk, the board behind, a sugar cube as the only sweetness; the body small and folded, the sound of the stamp the loudest thing."

[origin]
what = "L (Death Note) crouched in his chair, thumb at his lip, a sugar cube between finger and thumb; the case closed with a stamp."
recognisable = "Knees up, the feet on the seat, the torso upright on the legs, the head tipped, the thumb at the lip, one hand hung over the knees."
ours = "R6 crouch (the owner's drawing: legs forward along the seat, torso upright on them). The desk, board, lamp, file, stamp and bowl are the 'office' room's."

[source]
url = "https://www.youtube.com/watch?v=CmVV4q_fSCk"
title = "[Death Note] L explains why he can't sit right"
kind = "the anime scene (L crouched on the chair, front and three-quarter shots)"
watched = "2026-10-20 by the aceCrouch emote note (art/refs/emotes/aceCrouch.toml); not re-watched on 2026-11-24"
mirror = false

[source2]
url = "https://www.youtube.com/watch?v=zJlz4f2DGsc"
title = "Death Note 2: The Last Name (2006) - L and Light play chess (149 s)"
kind = "the live-action scene"
watched = "2026-11-24: a 16-frame contact sheet over the clip; L crouched over a board picking up a piece between finger and thumb, the other hand on his knee, the camera wide from above then close on the hands"
mirror = false

