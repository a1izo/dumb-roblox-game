[timing]
length = 7.8
fit = "Four cuts of 1.9 to 2.3 s, none under 1.4 s, every camera held by hand and drifting: A 0.0-1.9 from over the table's north-east, long lens, the first man comes in out of the dark between the chairs by the records door side, tugging his collar, the pinned case wall behind him; B 1.9-4.1 low over the table's top at the east side, seat 3 stops at his place, swings his arm and skids a case file across the lit wood (the file lands on the table at 3.6 s and slides to 9 studs from the middle), the pulse and a light focus on the throw; C 4.1-5.5 from over the table's south side, looking south, seats 11, 0 and 1 come in to their places (a cuff pulled, a tie touched); D 5.5-7.8 high and wide from the south-west corner under the ring chandelier, the last ones come in (seats 8 and 1) and the ring is full: every place holds someone facing the middle, heads moving, for 1.4 s. Eight walk in (seats 4, 3, 5, 2, 11, 0, 8, 1, stopping at 2.9, 3.2, 4.2, 4.5, 4.7, 5.1, 5.5 and 6.3 s, each 1.0 s or more behind the one who shares their gap); four are already in their places in the dark (seats 6, 7, 9, 10) and turn to watch."
lens = "Long lenses (fov 28 to 42 from 8 to 16 studs) for the arrivals, so a body is not all arm; one wide at fov 52 from 11 studs up for the end; the table is the foreground of A, B and C (a bright band under the people), its far edge hides the legs of whoever stands at a place."
light = "The preset's key over the table is kept; on top of it the shot's own lights, per cut: a cold key spot from above and in front on the people the cut films and a warm rim spot from behind and above, shadows off; a grade of contrast +0.18, saturation -0.2, brightness +0.05 and a cool tint lifts the picture a little; skin never glows."

[r6]
notes = "R6 has no elbows or knees: a coat shrugged off is both shoulders rolled back and the arm slid down the body; a file carried is an arm bent forward with the fist at the chest on a mark (body_reach), put down by turning the shoulder, not by reaching; both arms never alike; the head leads each turn and the body follows two to four frames later; heads stay up in close shots."

