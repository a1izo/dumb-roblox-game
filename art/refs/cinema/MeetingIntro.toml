# The meeting intro (shot MeetingIntro): the survivors arrive at the war room. Reference notes, kept the way
# art/refs/cinema/RoleAce.toml keeps its own.
id = "MeetingIntro"
name = "The war room fills"
status = "rebuilt 2026-11-17 (item 6 of docs/handoff/list-2026-11-16.md; plan note 1d of docs/handoff/animation-cutscene-plan-2026-11-13.md)"

[scene]
sentence = "Twelve people hurry into a dark war room one after another, each by a different way and each with their own business (a coat shrugged off, a file carried in, a chair gripped, a glance across the table), and by the time the last one is in, every one of them stands at their own place round the table under the one light, facing the middle, and nobody has spoken."
action = "The arrival of people: staggered, from the dark edge of the room into the pool of light, each person ending the same move, a turn on the spot to face the table and one step into the place, so the meeting starts exactly where the walk ends."
mood = "Dread and haste, not comedy (cutscene-quality-bar round 14): slow steady cameras, figures cut out against the lit table, the light from above."

[origin]
what = "The war rooms of film: Dr. Strangelove's round table under its ring of light, and the long table of the Five Families in The Godfather. Both show the same things we need: a dark room, one hard light over the table, faces lit from above, newcomers coming out of the dark into the pool of it while the seated turn their heads."
recognisable = "A dark room with a bright ring of light over a round table; people standing in a dark foreground as cut-out shapes; the one who comes in and is met at the door; a wide from high with every place filled round the glowing ring; long lenses along the table with shoulders in the foreground."
ours = "The war room is ours (maps/venues/meeting: twelve places at 17 studs, chairs at 19.6, one door, the records door in the east wall, closed). The film shows people already seated, so the arrivals, the file dropped, the coat and the chair are ours, made from how the film's people hold themselves at the table."

