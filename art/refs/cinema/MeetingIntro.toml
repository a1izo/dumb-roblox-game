[seen_in_game]
before = "2026-11-17 offline (check_motion.py, run_cinema.py --lint): 10 of 12 seat clips FAIL the motion report (both arms mirror images for the whole of every held pose; seats 8 and 9 also frozen 2.5 s); lint: 2 [shape] notes (seats 4 and 2: both arms hidden in the torso's outline) and 1 [end] (seat 5 still moving at 1.3 studs a second at the end). Six of the twelve walk in from the door's side in cuts of 1.5 s; the other six stand from the first frame with a head turn; 8 locked camera keys, two events."
found_in_code = "RoundService.meetingCast casts only the living players: seats 0..n-1 in a normal match (n is 6 to 12); any seat nobody is cast in gets a faceless stand-in (ShotPlayer: Stage.figure). MeetingService.gather() has already put the real players standing at their places (radius 17 facing the table) when the shot plays; gather(true) sits them in the chairs when the Meeting phase opens. The shot's actors are clones."

# The beats, each with the source (S1 = 3Y3Rrvh3FwE, S2 = GQ5v1bbn7kM, S3 = DF30eGXDIVU) and its time.

