# The Muerto's role scene (shot RoleMuerto). Reference notes, kept the way art/refs/emotes/*.toml keep theirs.
id = "RoleMuerto"
name = "Muerto: delete"
status = "built"

[origin]
what = "Mikami's 'delete' (Death Note, episode 36): writing the names, he slashes each one out, chanting 'sakujo' (delete)."
recognisable = "The pen raised high and brought down in a sweeping slash right across the page and on up into the air, the whole body thrown into it, hair whipping; extreme close-ups of the red-glowing eyes; the pen tearing a long line across the paper; then, done, thrown back with the arms wide against a white-hot glare."
ours = "Rebuilt from scratch 2026-10-28 (the owner: 'the stabs are slashes, not pressure points'): neat writing, then eight slashes, forehand and backhand, faster and faster, each tearing a red slash into the page and one line across the screen along the stroke (not radial streaks; no glowing eye blocks: the owner, 2026-10-28); the pen ground in at the last; panting; the head up into the camera; thrown back, arms wide, against the red city."

[source]
url = "https://www.youtube.com/watch?v=W-EbcQsIIIA"
title = "Teru Mikami DELETE! Death Note, Episode 36"
kind = "the anime scene"
watched = "2026-10-28: frame sheets every 5 s over 0-100 s, every 1 s over 24-43 s, every 1.5 s over 58-87 s, in the built-in browser"
mirror = false
alt = ["https://www.youtube.com/watch?v=dD-pfGR2S9I"]

[[beat]]
src = 26.0
pose = "the arm swinging the pen up in a big arc, a silhouette against white"
[[beat]]
src = 29.0
pose = "the face close, a red eye, the hair whipping across it"
[[beat]]
src = 34.0
pose = "the page from above, long pen slashes across it"
[[beat]]
src = 73.0
pose = "the nib tearing a long diagonal line across the page, the arm out of frame"
[[beat]]
src = 76.0
pose = "low angle: the whole body in the swing, the arm flung out with the pen, the head thrown back"
[[beat]]
src = 86.5
pose = "a silhouette against pink glare, arms spread wide, ecstatic"

[timing]
length = 18.0
fit = "7 cuts (3.6 s longer, 2026-10-28): writing (0-3.4); the first slash over the page (3.4-5.1); four slashes, hand-held (5.1-7.6); four faster, close (7.6-9.4); the last slash and the pen ground in (9.4-11.2); panting, the head up (11.2-14.0); thrown back, arms wide (14.0-18.0). DELETE on each of the ten slashes; each draws a curved crescent across the screen along its stroke (an impact frame, a red wash, sparks)."

[r6]
notes = "Hands placed with cinema.acting.body_reach (kit.reach in a leaning, turning body); the pen's nib checked on the page through each slash. The head stays up through the slashes (a bowed R6 head is only hair); the follow-throughs fling out low past the page's edge, never across the face; the last slash is a backhand so the pen arm ends on his right. The desk's screen (2.5 to his right) and lamp (1.4 to his left) stand at head height: the cameras keep to the front or go low over the desk."

[check]
by = "run_cinema --clear 0 problems; --lint (only momentary close-ups); contact sheets of every cut"

[set]
url = "https://www.youtube.com/watch?v=tBQhV6BWK18"
title = "Mikami delete compilation (Death Note episodes 31, 37 and Relight)"
watched = "2026-10-29: frame sheets every 0.6 s over 0-7 s and every 1.75 s over the rest, single frames at 5.0, 5.6, 6.8 and 12.75 s, in the built-in browser"
room = "The wide at 6.8 s: a long red desk with a silver rim on slim legs, a tall pale glowing monitor, a black keyboard, a silver gooseneck lamp, the open notebook and loose papers, on dark teal marble with pale veins. 5.0-5.6 s: behind the writer a floor-to-ceiling wall of small tall panes in thin mullions, blown out cold blue-white from outside. 12.75 s: frosted panels in dark frames glowing pink under recessed red downlights."
ours = "maps/venues/sets/flat.py (Sets v17): the north wall glass in a 10 by 5 grid of panes over a cold glare with the towers dark and low against it; the red lacquer desk (the old desk's footprint and top, so the shots still fit) with its monitor, keyboard, gooseneck lamp and papers; MarbleTeal floor; three framed FrostPink panels down each side wall under eight red downlights."
