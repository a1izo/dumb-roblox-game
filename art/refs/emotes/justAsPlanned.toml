[origin]
what = "Death Note (anime, 2006-07): Light Yagami, his memories of the notebook back, turns his head; the eyes slide to the side and catch a red glint; the head drops, the eyes glare up from under the hair and a slow grin spreads. The fansub line 'just as planned' (keikaku doori) made it a meme."
recognisable = "The slow turn into the sideways stare, the chin dropping into the grin with the eyes looking up."

[source]
url = "https://www.youtube.com/watch?v=BLnpA_bxMy8"
