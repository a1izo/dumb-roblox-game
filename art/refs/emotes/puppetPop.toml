# Bye Bye Bye (clip puppetPop, item emote_puppet_pop). Reference notes: what was watched, what was copied.
id = "puppetPop"
item = "emote_puppet_pop"
name = "Bye Bye Bye"
family = "dance"
status = "authored"            # researched | authored | checked | approved | vetoed
uses = []                      # other places the clip plays

[origin]
what = "The chorus routine of *NSYNC's 'Bye Bye Bye' music video (Jan 2000), choreographed by Darrin Henson (MTV VMA for Best Choreography, 2000); the band dance it as marionettes on strings. Revived as a 2024 trend by the opening of Deadpool & Wolverine."
recognisable = "The 'hey' arm flicks, the hands pulled to the chest and pushed out palms first on 'bye, bye, bye', the arms spread wide, hands on hips with the knee pops and the look over the shoulder, the raised fist with stomping knees."

[source]
url = "https://www.youtube.com/watch?v=on3NLCroLRI"
title = "MIRRORED TREND Deadpool Bye Bye Bye NSYNC Dance Tutorial (K-PROJECT Studio)"
kind = "tutorial, mirrored, front-facing, one dancer, at song speed"
watched = "2026-10-17, frame sheets every 0.125 s over 3.75-11.25 s, every 0.25-0.75 s over the rest"
mirror = true                  # screen-left is the dancer's left
alt = [
  "https://www.youtube.com/watch?v=RBCnRCZMVtU (official video, 4K remaster upload; stage scenes with the puppet strings, heavily intercut)",
  "https://www.youtube.com/watch?v=Eo-KmOd3i7s (official video, NSYNC VEVO)",
]
history = [
  "https://www.today.com/today/amp/tdna192941 (Darrin Henson on the choreography)",
  "https://en.wikipedia.org/wiki/Bye_Bye_Bye",
]

[timing]
bpm = 173
segment = [4.0, 11.0]          # seconds in the source
first_beat = 4.0
beats = 22                     # 20 beats of the routine + 2 to come home to the first pose
loop = true
length = 7.630

