[face]
key = ""                       # the dancers smile; no drawn face needed

[sound]
cues = ["loop: the song's chorus at 173 bpm (owner's licensed track), started on the shared beat"]
match = false                  # loud music: lobby only for the music; the dance itself is match-safe

[vfx]
rung = 2                       # Inked
ideas = ["faint marionette strings flicker above the hands on the first flick (4.13) and the push (5.63)"]

[camera]
showpiece = false

[r6]
notes = "No elbows or wrists: bent arms are the forearm direction with the fist slid to the hand's place (kit.reach); palms-out reads from the arm angle. Knee pops are a leg lifted forward and slid up. Hands on hips: arm angled out at the bottom, fist slid in."
pop_limit = 1800               # the 'hey' flicks are snaps

[check]
by_eye = "2026-10-17: mirrored stills at 24 reference times match the tutorial's silhouettes (flicks, cross, tilt, push, palms up, spread, hips + look, knee pops, kick back, wide bounce, swing, fist)."
silhouettes = "ok"
timing = "keys on the source times, 173 bpm; loop 22 beats"
contacts = "none (no props)"
issues = ["forward push reads as arms out from the front view: check from the side in the video"]
