[face]
key = ""                       # the dancers smile; no drawn face needed

[sound]
cues = ["loop: the song's chorus at 173 bpm (owner's licensed track), started on the shared beat"]
match = false                  # loud music: lobby only for the music; the dance itself is match-safe

[vfx]
rung = 2                       # Inked
ideas = ["faint marionette strings flicker above the hands on the first flick (4.13) and the push (5.63)"]

[camera]
showpiece = false

[r6]
notes = "No elbows or wrists: bent arms are the forearm direction with the fist slid to the hand's place (kit.reach); palms-out reads from the arm angle. Knee pops are a leg lifted forward and slid up. Hands on hips: arm angled out at the bottom, fist slid in."
pop_limit = 1800               # the 'hey' flicks are snaps

[mocap]
take = "art/refs/mocap/puppetPop.json"
notes = "2026-10-17 rework (owner: weird legs, arms pulled in, no real weight): tracked with MediaPipe Pose (heavy) on 111 frames, 3.92-11.32 s at 15 a second, each flipped back from the mirror first; the clip is the tracked frames from 4.0 s over 20 beats, then 2 beats easing home."

[check]
by_eye = "2026-10-17 rework: 16 reference frames side by side with the render (mirrored like the source), consecutive frames for smoothness, the loop's way home. First build: mirrored stills at 24 reference times (flicks, cross, tilt, push, palms up, spread, hips + look, knee pops, kick back, wide bounce, swing, fist)."
silhouettes = "ok"
timing = "keys on the source times, 173 bpm; loop 22 beats"
contacts = "none (no props)"
issues = ["the hands pulled to the chest (4.25) show as the arms bent out to the sides: an R6 arm cannot fold in that far"]
